<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGSPACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #07070c; overflow: hidden; }
    canvas { display: block; }
    #atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      transition: background 0.8s ease;
    }
    #scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
    }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 9;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.78) 100%);
    }
    #grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 11; opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    #hud { position: fixed; inset: 0; z-index: 8; pointer-events: none; color: #d0e0f0; font-family: "JetBrains Mono", monospace; }
    #hud * { pointer-events: none; }
    #hud button, #hud .hit { pointer-events: auto; }
    #boot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(7,7,12,0.92); transition: opacity 0.7s ease;
    }
    #boot .mark { font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: 0.35em; font-size: 28px; }
    #boot .sub { font-size: 11px; letter-spacing: 0.22em; color: #7a8a9a; }
    #boot .bar { width: 220px; height: 2px; background: #1a2230; overflow: hidden; }
    #boot .bar > i { display: block; height: 100%; width: 0; background: #00d4ff; box-shadow: 0 0 12px #00d4ff; animation: load 1.4s ease forwards; }
    @keyframes load { to { width: 100%; } }
    #log {
      position: absolute; top: 22px; left: 22px; width: 280px;
      display: flex; flex-direction: column; gap: 4px;
    }
    #log .row { font-size: 10px; letter-spacing: 0.04em; opacity: 0.9; text-shadow: 0 0 8px currentColor; }
    #tele {
      position: absolute; top: 22px; right: 22px; text-align: right; font-size: 10px; line-height: 1.7; color: #8aa;
    }
    #tele b { color: #d0e0f0; font-weight: 500; }
    #actions {
      position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%);
      display: none; gap: 8px; padding: 10px 12px;
      background: rgba(8,10,16,0.88); border: 1px solid rgba(0,212,255,0.35);
    }
    #actions.show { display: flex; }
    #actions button {
      font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 0.12em;
      padding: 7px 10px; background: transparent; color: inherit; cursor: pointer;
      border: 1px solid currentColor;
    }
    #actions button:hover { background: rgba(255,255,255,0.06); }
    #sel-label {
      position: absolute; left: 50%; bottom: 148px; transform: translateX(-50%);
      font-family: Orbitron, sans-serif; font-size: 11px; letter-spacing: 0.18em;
      display: none; text-shadow: 0 0 12px currentColor;
    }
    #sel-label.show { display: block; }

    #channel {
      position: absolute; top: 22px; left: 312px; width: 320px;
      display: none; flex-direction: column; gap: 8px;
      padding: 12px; pointer-events: auto;
      background: rgba(8,10,16,0.92);
      border: 1px solid rgba(0,255,136,0.35);
      font-family: "JetBrains Mono", monospace;
    }
    #channel.open { display: flex; }
    #channel.locked { border-color: rgba(255,51,102,0.55); }
    #channel-head { font-family: Orbitron, sans-serif; font-size: 11px; letter-spacing: 0.16em; color: #00FF88; }
    #channel.locked #channel-head { color: #FF3366; }
    #channel-log { max-height: 140px; overflow: auto; display: flex; flex-direction: column; gap: 4px; font-size: 10px; }
    #channel-log .me { color: #00D4FF; }
    #channel-log .them { color: #00FF88; }
    #channel-log .sys { color: #FFAA00; }
    #channel-form { display: flex; gap: 6px; }
    #channel-form input {
      flex: 1; background: #0b0e14; border: 1px solid #223; color: #d0e0f0;
      font: 11px "JetBrains Mono", monospace; padding: 6px 8px;
    }
    #channel-form button {
      font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 0.12em;
      padding: 6px 10px; background: transparent; color: #00FF88; border: 1px solid #00FF88; cursor: pointer;
    }

    #hint {
      position: absolute; bottom: 22px; left: 22px; font-size: 10px; color: #556; letter-spacing: 0.14em;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="atmosphere"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="hud">
    <div id="boot">
      <div class="mark" id="boot-mark">SIGSPACE</div>
      <div class="sub" id="boot-sub">LINKING SIGNAL FIELD</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="log"></div>
    <div id="tele"></div>
    <div id="sel-label"></div>
    <div id="actions"></div>
    <div id="channel">
      <div id="channel-head">SEALED CHANNEL</div>
      <div id="channel-log"></div>
      <form id="channel-form" autocomplete="off">
        <input id="channel-input" maxlength="240" placeholder="Message this node…" />
        <button type="submit">SEND</button>
      </form>
    </div>
    <div id="hint">← → TUNE &nbsp;·&nbsp; CLICK A NODE &nbsp;·&nbsp; DEVICE → POWER OFF</div>
  </div>
  <script>

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const atm = document.getElementById('atmosphere');
    const logEl = document.getElementById('log');
    const teleEl = document.getElementById('tele');
    const actionsEl = document.getElementById('actions');
    const selEl = document.getElementById('sel-label');
    const bootEl = document.getElementById('boot');
    const bootSub = document.getElementById('boot-sub');
    const channelForm = document.getElementById('channel-form');
    const channelInput = document.getElementById('channel-input');
    channelForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = channelInput.value.trim();
      if (!text) return;
      channelInput.value = '';
      sendChannel(text);
    });

    const DC = {
      bg: '#07070c',
      muted: '#3A4A5A',
      fg: '#D0E0F0',
      freq: ['#00D4FF','#00FF88','#FFAA00','#CC44FF','#FF3366','#66FFCC'],
      names: ['CARRIER','TOPOLOGY','STREAM','BLUETOOTH','THREAT','DEVICE'],
    };
    const WORKER_URL = 'https://sigspace.andres-491.workers.dev';
    const ACTIONS = [
      { id:'pin',     label:'PIN',     color:'#00D4FF' },
      { id:'channel', label:'CHANNEL', color:'#00FF88' },
      { id:'power',   label:'POWER OFF', color:'#FFAA00' },
      { id:'block',   label:'BLOCK',   color:'#FF3366' },
      { id:'toggle',  label:'TOGGLE',  color:'#00FF88' },
      { id:'request', label:'REQUEST', color:'#00D4FF' },
      { id:'close',   label:'CLOSE',   color:'#FFAA00' },
    ];
    const DEVICE_REACH = 'http://127.0.0.1:5070';

    const S = {
      W:0, H:0, cx:0, cy:0, freq:0,
      nodes:[], particles:[], meteors:[], stars:[], rings:[], nebula:[],
      transition:0, t:0, data:{},
      selected: null,
      log: [],
      workerOk: null,
      boot: 1,
      blocked: new Set(JSON.parse(localStorage.getItem('sigspace-blocked') || '[]')),
      channels: {},
      channelIdx: null,
    };
    const THREAT_BLOCK = 25;

    function rgb(hex) { return hex.slice(1).match(/../g).map(x => parseInt(x,16)); }
    function rgba(hex, a) { const [r,g,b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
    function freqCol(f=S.freq, a=1) { return a===1 ? DC.freq[f] : rgba(DC.freq[f], a); }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      S.W = canvas.width; S.H = canvas.height;
      S.cx = S.W/2; S.cy = S.H/2;
    }
    window.addEventListener('resize', resize);
    resize();

    function initStars() {
      S.stars = Array.from({length: 180}, () => ({
        x: Math.random(), y: Math.random(),
        r: Math.random()*1.5+0.2,
        a: Math.random()*0.55+0.08,
        phase: Math.random()*Math.PI*2,
        speed: Math.random()*0.004+0.001,
      }));
      S.nebula = Array.from({length: 5}, (_, i) => ({
        x: Math.random(), y: Math.random(),
        r: 180 + Math.random()*260,
        a: 0.05 + Math.random()*0.07,
        phase: Math.random()*Math.PI*2,
      }));
    }
    initStars();

    function glowCircle(x, y, r, hex, maxA=0.85) {
      const [rv,gv,bv] = rgb(hex);
      [[r*7,0.04],[r*3.5,0.12],[r*1.8,0.35],[r,maxA]].forEach(([rad,a]) => {
        const g2 = ctx.createRadialGradient(x,y,0,x,y,rad);
        g2.addColorStop(0, `rgba(${rv},${gv},${bv},${a})`);
        g2.addColorStop(1, `rgba(${rv},${gv},${bv},0)`);
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
      });
    }
    function hudCorners(x, y, w, h, hex, sz=14) {
      ctx.save();
      ctx.strokeStyle = rgba(hex, 0.55);
      ctx.lineWidth = 1.5;
      [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx+dx*sz, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+dy*sz);
        ctx.stroke();
      });
      ctx.restore();
    }

    function addLog(msg, color) {
      S.log.unshift({ msg, color: color||'#00D4FF', t: S.t });
      if (S.log.length > 7) S.log.pop();
      renderLog();
    }
    function renderLog() {
      logEl.innerHTML = S.log.map(r =>
        `<div class="row" style="color:${r.color}">${r.msg}</div>`
      ).join('');
    }
    function renderTele() {
      const src = S.workerOk ? 'WORKER' : (S.workerOk === false ? 'FALLBACK' : 'PROBE');
      teleEl.innerHTML =
        `REALM <b>${DC.names[S.freq]}</b><br>` +
        `NODES <b>${S.nodes.length}</b><br>` +
        `LINK <b style="color:${S.workerOk?'#00FF88':'#FFAA00'}">${src}</b><br>` +
        `UPTIME <b>${Math.floor(S.t/60)}m</b>`;
    }

    function nodeXY(node) {
      return {
        x: S.cx + node.distance * Math.cos(node.angle),
        y: S.cy + node.distance * Math.sin(node.angle),
      };
    }

    function spawnNodes(arr) {
      S.selected = null;
      hideActions();
      S.nodes = arr.map((d, i) => ({
        label: d.label || '???',
        sublabel: d.sublabel || '',
        color: d.color || DC.freq[S.freq],
        size: d.size || 6,
        distance: d._distance || (130 + (i%4)*60 + Math.random()*20),
        angle: (i / Math.max(arr.length,1)) * Math.PI*2 + Math.random()*0.3,
        speed: (d.speed || 0.004) * (Math.random()>0.5?1:-1),
        baseSpeed: (d.speed || 0.004) * (Math.random()>0.5?1:-1),
        phase: Math.random()*Math.PI*2,
        pinned: false,
        active: true,
        flash: 0,
        flashCol: '#ffffff',
        msgBeam: 0,
        blocked: S.blocked.has(d.label) || S.blocked.has(d.ip) || !!d.blocked,
        threatScore: d.threatScore || 0,
        ip: d.ip || '',
        deviceId: d.deviceId || '',
        canPowerOff: !!d.canPowerOff,
        driver: d.driver || '',
      }));
      S.nodes.forEach(n => { if (n.blocked) { n.active = false; n.color = '#FF3366'; } });
      addLog('FIELD LOCK  ' + DC.names[S.freq], DC.freq[S.freq]);
      renderTele();
    }

    function hideActions() {
      actionsEl.classList.remove('show');
      selEl.classList.remove('show');
      actionsEl.innerHTML = '';
    }

    function isSuspicious(node) {
      return !!(node.blocked || (node.threatScore || 0) >= THREAT_BLOCK);
    }
    function persistBlocked() {
      localStorage.setItem('sigspace-blocked', JSON.stringify([...S.blocked]));
    }
    function blockNode(idx, reason) {
      const node = S.nodes[idx];
      if (!node) return;
      node.blocked = true;
      node.active = false;
      node.color = '#FF3366';
      node.flash = 30;
      node.flashCol = '#FF3366';
      S.blocked.add(node.label);
      if (node.ip) S.blocked.add(node.ip);
      persistBlocked();
      addLog('BLOCKED: ' + node.label + (reason ? '  ·  ' + reason : ''), '#FF3366');
      if (S.channelIdx === idx) closeChannel();
      hideActions();
    }
    function closeChannel() {
      S.channelIdx = null;
      const el = document.getElementById('channel');
      el.classList.remove('open');
      el.classList.remove('locked');
    }
    function renderChannel() {
      const el = document.getElementById('channel');
      const log = document.getElementById('channel-log');
      const head = document.getElementById('channel-head');
      const node = S.nodes[S.channelIdx];
      if (!node) { closeChannel(); return; }
      const locked = isSuspicious(node);
      el.classList.add('open');
      el.classList.toggle('locked', locked);
      head.textContent = locked ? 'CHANNEL REFUSED  ·  BLOCKED' : ('SEALED CHANNEL  ·  ' + node.label);
      const msgs = S.channels[node.label] || [];
      log.innerHTML = msgs.map(m =>
        `<div class="${m.who}">${m.who === 'me' ? 'YOU' : node.label}: ${m.text}` +
        (m.seal ? `  <span style="color:#556">${m.seal}</span>` : '') + '</div>'
      ).join('') || '<div class="sys">Channel open. Locally sealed. Not a public feed.</div>';
      log.scrollTop = log.scrollHeight;
    }
    async function sealText(text) {
      try {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text + '|' + Date.now()));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 12);
      } catch (e) { return 'local'; }
    }
    async function openChannel(idx) {
      const node = S.nodes[idx];
      if (!node) return;
      if (isSuspicious(node)) {
        blockNode(idx, 'suspicion');
        return;
      }
      S.channelIdx = idx;
      if (!S.channels[node.label]) S.channels[node.label] = [];
      S.channels[node.label].push({ who:'sys', text:'Secure channel established with ' + node.label + '.' });
      addLog('CHANNEL OPEN  ' + node.label, '#00FF88');
      node.flash = 18; node.flashCol = '#00FF88'; node.msgBeam = 30;
      renderChannel();
    }
    async function sendChannel(text) {
      const node = S.nodes[S.channelIdx];
      if (!node || isSuspicious(node)) {
        if (node) blockNode(S.channelIdx, 'suspicion');
        return;
      }
      const seal = await sealText(text);
      S.channels[node.label].push({ who:'me', text, seal });
      renderChannel();
      addLog('SEALED → ' + node.label, '#00D4FF');
      node.msgBeam = 40; node.flash = 16; node.flashCol = '#00D4FF';
      setTimeout(() => {
        if (S.channelIdx == null) return;
        S.channels[node.label].push({
          who:'them',
          text: 'ACK on sealed channel.',
          seal: 'peer',
        });
        renderChannel();
      }, 700);
    }

    function showActions(idx) {
      const node = S.nodes[idx];
      if (!node) return;
      S.selected = idx;
      const tag = isSuspicious(node) ? '  ·  BLOCKED' : '';
      selEl.textContent = node.label + (node.sublabel ? '  ·  ' + node.sublabel : '') + tag;
      selEl.style.color = isSuspicious(node) ? '#FF3366' : node.color;
      selEl.classList.add('show');
      const acts = ACTIONS.filter(a => {
        if (a.id === 'channel' && isSuspicious(node)) return false;
        if (a.id === 'power' && (isSuspicious(node) || !node.canPowerOff || !node.deviceId)) return false;
        return true;
      });
      actionsEl.innerHTML = acts.map(a =>
        `<button data-act="${a.id}" style="color:${a.color}">${a.label}</button>`
      ).join('');
      actionsEl.classList.add('show');
      [...actionsEl.querySelectorAll('button')].forEach(btn => {
        btn.onclick = () => executeAction(btn.dataset.act, idx);
      });
    }

    function executeAction(actionId, nodeIdx) {
      const node = S.nodes[nodeIdx];
      if (!node) return;
      switch(actionId) {
        case 'pin':
          node.pinned = !node.pinned;
          node.speed = node.pinned ? 0 : node.baseSpeed;
          addLog(`${node.pinned?'PINNED':'UNPINNED'}: ${node.label}`, '#00D4FF');
          node.flash=18; node.flashCol='#00D4FF';
          break;
        case 'channel':
          openChannel(nodeIdx);
          break;
        case 'power':
          powerOffNode(nodeIdx);
          break;
        case 'block':
          blockNode(nodeIdx, 'manual');
          break;
        case 'toggle':
          node.active = !node.active;
          addLog(`${node.active?'MONITORING':'IGNORED'}: ${node.label}`, '#00FF88');
          node.flash=18; node.flashCol='#00FF88';
          break;
        case 'request':
          if (isSuspicious(node)) { blockNode(nodeIdx, 'suspicion'); return; }
          addLog(`CONN REQUEST → ${node.label}`, '#00D4FF');
          node.flash=22; node.flashCol='#00D4FF';
          node.msgBeam=40;
          break;
        case 'close':
          addLog(`CONN CLOSED: ${node.label}`, '#FFAA00');
          node.flash=25; node.flashCol='#FFAA00';
          node.active=false;
          if (S.channelIdx === nodeIdx) closeChannel();
          break;
      }
      if (actionId !== 'channel') {
        S.selected = null;
        hideActions();
      }
    }

    function drawNodes() {
      S.nodes.forEach((node, idx) => {
        node.angle += node.speed;
        const {x:nx, y:ny} = nodeXY(node);
        const pulse = 0.78 + 0.22 * Math.sin(S.t*0.04 + node.phase);
        const dim = node.active ? 1 : 0.28;
        ctx.save();
        ctx.globalAlpha = dim;

        ctx.strokeStyle = rgba(node.color, 0.07);
        ctx.lineWidth = 1;
        ctx.setLineDash([3,14]);
        ctx.beginPath(); ctx.arc(S.cx, S.cy, node.distance, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = rgba(node.color, 0.14);
        ctx.setLineDash([5,9]);
        ctx.lineDashOffset = -(S.t * 0.6);
        ctx.beginPath(); ctx.moveTo(S.cx, S.cy); ctx.lineTo(nx, ny); ctx.stroke();
        ctx.setLineDash([]); ctx.lineDashOffset = 0;

        if (node.msgBeam > 0) {
          ctx.strokeStyle = rgba(node.color, 0.55 * (node.msgBeam/50));
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(S.cx, S.cy); ctx.lineTo(nx, ny); ctx.stroke();
          node.msgBeam--;
        }

        glowCircle(nx, ny, node.size * pulse, node.color, 0.9);
        ctx.beginPath(); ctx.arc(nx, ny, node.size*0.45*pulse, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();

        if (S.selected === idx) {
          ctx.strokeStyle = rgba(node.color, 0.8);
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(nx, ny, node.size*pulse + 10, 0, Math.PI*2); ctx.stroke();
        }
        if (node.flash > 0) {
          glowCircle(nx, ny, node.size*pulse + 8, node.flashCol, node.flash/18);
          node.flash--;
        }

        const ly = ny - node.size*pulse - 7;
        ctx.font = '10px "JetBrains Mono"';
        ctx.fillStyle = node.color; ctx.textAlign='center';
        ctx.fillText(node.label, nx, ly+9);
        if (node.sublabel) {
          ctx.font = '8px "JetBrains Mono"';
          ctx.fillStyle = DC.muted;
          ctx.fillText(node.sublabel, nx, ly-2);
        }
        ctx.restore();

        if (node.active && Math.random() < 0.06) {
          S.particles.push({
            x:nx, y:ny, vx:(Math.random()-0.5)*1.4, vy:(Math.random()-0.5)*1.4,
            life:45, max:45, color:node.color, r:Math.random()*2+0.5,
          });
        }
      });

      S.particles = S.particles.filter(p => p.life > 0);
      S.particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = (p.life/p.max) * 0.7;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(p.life/p.max), 0, Math.PI*2); ctx.fill();
        ctx.restore();
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96; p.life--;
      });
    }

    function drawCharacter() {
      const x=S.cx, y=S.cy + Math.sin(S.t*0.05)*2;
      const clr = DC.freq[S.freq];
      const pulse = 0.7 + 0.3*Math.sin(S.t*0.05);
      ctx.save();
      hudCorners(x-52, y-58, 104, 84, clr, 15);
      const scanY = y - 32 + ((S.t * 0.9) % 64);
      const sg = ctx.createLinearGradient(x-52, scanY, x+52, scanY);
      sg.addColorStop(0, 'transparent');
      sg.addColorStop(0.5, rgba(clr, 0.14*pulse));
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.fillRect(x-52, scanY, 104, 2);

      ctx.fillStyle = '#0D1520';
      ctx.beginPath();
      ctx.moveTo(x-44,y+14); ctx.lineTo(x,y+7); ctx.lineTo(x+44,y+14); ctx.lineTo(x,y+21);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(clr, 0.4); ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x-44,y+14); ctx.lineTo(x,y+7); ctx.lineTo(x+44,y+14); ctx.stroke();

      ctx.fillStyle = rgba(clr, 0.16*pulse);
      ctx.fillRect(x-14,y-11,28,19);
      ctx.strokeStyle = clr; ctx.lineWidth=1.5;
      ctx.strokeRect(x-14,y-11,28,19);
      ctx.font = '6px "Orbitron"';
      ctx.fillStyle = clr; ctx.textAlign='center';
      ctx.fillText(DC.names[S.freq].slice(0,4), x, y+2);

      ctx.fillStyle = '#B0C4DC'; ctx.fillRect(x-5, y-23, 10, 12);
      ctx.beginPath(); ctx.arc(x, y-28, 6, 0, Math.PI*2);
      ctx.fillStyle = '#D0E0F0'; ctx.fill();
      ctx.fillStyle = '#B0C4DC';
      ctx.fillRect(x-11, y-21, 4, 9);
      ctx.fillRect(x+7,  y-21, 4, 9);
      glowCircle(x-2, y-29, 1.5, clr, 1);
      glowCircle(x+2, y-29, 1.5, clr, 1);
      ctx.restore();
    }

    function drawGlitch() {
      const k = S.transition/20;
      ctx.save();
      for (let i=0; i<Math.ceil(8*k); i++) {
        const ty = Math.random()*S.H;
        const th = Math.random()*7+1;
        const tx = (Math.random()-0.5)*35*k;
        ctx.drawImage(canvas, 0,ty,S.W,th, tx,ty,S.W,th);
      }
      ctx.globalAlpha = 0.1*k;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(canvas, -4*k, 0);
      ctx.drawImage(canvas, 4*k, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.1*k;
      for (let i=0; i<160; i++) {
        ctx.fillStyle = Math.random()>0.55 ? '#ffffff' : DC.freq[S.freq];
        ctx.fillRect(Math.random()*S.W, Math.random()*S.H, 2, 1);
      }
      ctx.globalAlpha = k*0.85;
      ctx.font = `bold ${29+Math.random()*10}px "Orbitron"`;
      ctx.fillStyle = DC.freq[S.freq];
      ctx.textAlign='center';
      ctx.shadowBlur=28; ctx.shadowColor=DC.freq[S.freq];
      ctx.fillText(DC.names[S.freq], S.cx+(Math.random()-0.5)*10, S.cy-94);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
      ctx.restore();
    }

    const DNS_DOMAINS = [
      'google.com','youtube.com','github.com','apple.com','microsoft.com',
      'cloudflare.com','netflix.com','reddit.com','amazon.com',
      'discord.com','slack.com','spotify.com','icloud.com','akamai.com','fastly.com'
    ];
    let _dnsIdx=0, _dnsTimer=null;

    function spawnMeteor(domain, ip) {
      const side = Math.floor(Math.random()*4);
      let sx, sy;
      if (side===0){sx=Math.random()*S.W; sy=-20;}
      else if(side===1){sx=S.W+20; sy=Math.random()*S.H;}
      else if(side===2){sx=Math.random()*S.W; sy=S.H+20;}
      else{sx=-20; sy=Math.random()*S.H;}
      const ex=S.cx+(Math.random()-0.5)*200, ey=S.cy+(Math.random()-0.5)*100;
      const isDNS=['google','cloudflare','apple','microsoft'].some(k=>domain.includes(k));
      const isCDN=['akamai','fastly','amazon'].some(k=>(domain+ip).includes(k));
      const color = isDNS?'#00D4FF': isCDN?'#FFAA00':'#00FF88';
      S.meteors.push({x:sx,y:sy,tx:ex,ty:ey,domain,ip,color,life:135,max:135,size:2.2+Math.random()*1.8});
    }

    function drawMeteors() {
      S.meteors = S.meteors.filter(m => m.life>0);
      S.meteors.forEach(m => {
        const prog = 1 - m.life/m.max;
        const x = m.x+(m.tx-m.x)*prog;
        const y = m.y+(m.ty-m.y)*prog;
        const alpha = Math.min(1, m.life/28);
        ctx.save(); ctx.globalAlpha=alpha;
        glowCircle(x, y, m.size, m.color, 0.7);
        ctx.fillStyle='#ffffff';
        ctx.beginPath(); ctx.arc(x,y,m.size*0.55,0,Math.PI*2); ctx.fill();
        const tailX=m.x+(m.tx-m.x)*Math.max(0,prog-0.14);
        const tailY=m.y+(m.ty-m.y)*Math.max(0,prog-0.14);
        const tg = ctx.createLinearGradient(tailX,tailY,x,y);
        tg.addColorStop(0,'transparent');
        tg.addColorStop(1, rgba(m.color, 0.55));
        ctx.strokeStyle=tg; ctx.lineWidth=1.8;
        ctx.globalAlpha=alpha*0.7;
        ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(x,y); ctx.stroke();
        if (prog > 0.52) {
          ctx.globalAlpha = alpha*(prog-0.52)/0.48;
          ctx.font='9px "JetBrains Mono"'; ctx.textAlign='left';
          ctx.fillStyle=m.color;
          ctx.shadowBlur=6; ctx.shadowColor=m.color;
          ctx.fillText(m.domain, x+8, y-2);
          ctx.fillStyle=DC.muted; ctx.shadowBlur=0;
          ctx.fillText(m.ip, x+8, y+10);
        }
        ctx.restore(); m.life--;
      });
    }

    function renderDial() {
      let el = document.getElementById('dial');
      if (!el) {
        el = document.createElement('div');
        el.id = 'dial';
        el.style.cssText = 'position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:10px 14px;background:rgba(8,10,16,0.9);border:1px solid rgba(255,255,255,0.08);pointer-events:auto;';
        document.getElementById('hud').appendChild(el);
      }
      el.innerHTML = DC.names.map((n,i) => {
        const on = i===S.freq;
        const c = DC.freq[i];
        return `<button data-f="${i}" style="font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:0.14em;padding:8px 12px;border:1px solid ${on?c:'#223'};background:${on?rgba(c,0.15):'transparent'};color:${on?c:'#556'};box-shadow:${on?'0 0 16px '+rgba(c,0.35):'none'}">${n}</button>`;
      }).join('');
      [...el.querySelectorAll('button')].forEach(b => b.onclick = () => {
        const next = +b.dataset.f;
        if (next !== S.freq) switchFreq(next);
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key==='ArrowRight') switchFreq((S.freq+1)%6);
      if (e.key==='ArrowLeft')  switchFreq((S.freq+5)%6);
    });

    canvas.addEventListener('click', e => {
      const hitR = 28;
      for (let i=S.nodes.length-1; i>=0; i--) {
        const {x,y} = nodeXY(S.nodes[i]);
        const dx=e.clientX-x, dy=e.clientY-y;
        if (dx*dx+dy*dy < hitR*hitR) { showActions(i); return; }
      }
      S.selected = null; hideActions();
    });

    function switchFreq(next) {
      S.freq=next; S.transition=20;
      S.nodes=[]; S.particles=[]; S.rings=[]; S.selected=null; hideActions();
      if (_dnsTimer) { clearInterval(_dnsTimer); _dnsTimer=null; }
      renderDial();
      loadRealm(next);
    }

    async function probeWorker() {
      try {
        const r = await Promise.race([
          fetch(WORKER_URL + '/', { cache: 'no-store' }),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'), 2500))
        ]);
        S.workerOk = r.ok;
      } catch(e) { S.workerOk = false; }
      addLog(S.workerOk ? 'WORKER LINK UP' : 'WORKER UNREACHABLE — FALLBACK', S.workerOk?'#00FF88':'#FFAA00');
      renderTele();
    }

    async function fetchGeo(ip) {
      const q = ip ? ('?ip=' + encodeURIComponent(ip)) : '';
      try {
        const r = await Promise.race([
          fetch(WORKER_URL + '/api/geo' + q),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'), 2500))
        ]);
        if (r.ok) { const d = await r.json(); if (d.status==='success' || d.city) return d; }
      } catch(e) {}
      try {
        const r = await fetch('https://ipwho.is/');
        const d = await r.json();
        if (d.success !== false) {
          return {
            status:'success', query:d.ip, city:d.city, country:d.country,
            countryCode:d.country_code, regionName:d.region,
            isp: (d.connection&&d.connection.isp)||'', as: (d.connection&&d.connection.asn)?('AS'+d.connection.asn):'',
            lat:d.latitude, lon:d.longitude, timezone:d.timezone&&d.timezone.id,
          };
        }
      } catch(e) {}
      return { status:'fail', query:'?.?.?.?', city:'Unknown', country:'Unknown', countryCode:'UN', isp:'Unknown', as:'AS???', lat:0, lon:0, timezone:'' };
    }

    async function fetchBatchGeo(ips) {
      try {
        const r = await Promise.race([
          fetch(WORKER_URL + '/api/geo/batch', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(ips),
          }),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'), 2500))
        ]);
        if (r.ok) return await r.json();
      } catch(e) {}
      try {
        const r = await fetch('https://ip-api.com/batch', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(ips.map(q => ({query:q, fields:'status,country,countryCode,city,isp,query'}))),
        });
        return await r.json();
      } catch(e) { return []; }
    }

    async function fetchDoh(domain) {
      try {
        const r = await Promise.race([
          fetch(WORKER_URL + '/api/doh?name=' + encodeURIComponent(domain)),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'), 2000))
        ]);
        if (r.ok) return await r.json();
      } catch(e) {}
      const r = await fetch(`https://1.1.1.1/dns-query?name=${domain}&type=A`, { headers:{'Accept':'application/dns-json'} });
      return await r.json();
    }

    async function loadRealm(f) {
      S.nodes=[]; S.particles=[]; S.meteors=[];
      if (f===0) await loadCarrier();
      else if (f===1) await loadTopology();
      else if (f===2) await loadStream();
      else if (f===3) await loadBluetooth();
      else if (f===4) await loadThreat();
      else if (f===5) await loadDevices();
    }

    function countryFlag(code) {
      if (!code||code.length!==2) return 'WEB';
      return String.fromCodePoint(...[...code.toUpperCase()].map(c=>0x1F1E0+c.charCodeAt(0)-65));
    }


    async function powerOffNode(idx) {
      const node = S.nodes[idx];
      if (!node) return;
      if (isSuspicious(node) || !node.canPowerOff || !node.deviceId) {
        addLog('POWER DENIED  ' + (node ? node.label : '?'), '#FF3366');
        if (node && isSuspicious(node)) blockNode(idx, 'suspicion');
        return;
      }
      addLog('POWER OFF → ' + node.label, '#FFAA00');
      node.flash = 28; node.flashCol = '#FFAA00'; node.msgBeam = 45;
      try {
        const r = await Promise.race([
          fetch(DEVICE_REACH + '/api/poweroff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: node.deviceId }),
          }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000)),
        ]);
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          addLog('POWERED DOWN  ' + node.label + (d.driver ? '  ·  ' + d.driver : ''), '#00FF88');
          node.active = false;
          node.sublabel = (node.sublabel || '') + '  ·  OFF';
        } else {
          addLog('POWER FAIL  ' + (d.error || d.note || node.label), '#FF3366');
        }
      } catch (e) {
        addLog('POWER FAIL  device-reach offline', '#FF3366');
      }
    }

    async function loadDevices() {
      let devices = [];
      try {
        const r = await Promise.race([
          fetch(DEVICE_REACH + '/api/devices'),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500)),
        ]);
        if (r.ok) {
          const d = await r.json();
          devices = (d.devices || []).slice(0, 14);
        }
      } catch (e) {}
      if (!devices.length) {
        devices = [
          { id: 'sim:living-room-tv', name: 'Living Room TV (sim)', kind: 'tv', driver: 'simulated', can_power_off: true },
          { id: 'sim:samsung', name: 'Samsung TV (sim)', kind: 'tv', driver: 'simulated', can_power_off: true },
          { id: 'sim:soundbar', name: 'Soundbar (sim)', kind: 'media', driver: 'simulated', can_power_off: true },
        ];
      }
      const c = DC.freq[5];
      spawnNodes(devices.map((d, i) => {
        const label = d.name || d.id || 'device';
        const driver = d.driver || '?';
        const can = d.can_power_off !== false;
        return {
          label: label.length > 20 ? label.slice(0, 20) + '…' : label,
          sublabel: (d.kind || 'device') + '  ·  ' + driver + (can ? '' : '  ·  NO PWR'),
          color: driver === 'samsung' ? '#00D4FF' : c,
          size: d.kind === 'tv' ? 11 : 7,
          speed: 0.002 + i * 0.00025,
          deviceId: d.id,
          canPowerOff: can,
          driver,
          ip: d.host || '',
        };
      }));
      addLog('DEVICE FIELD  ' + devices.length + ' in reach', c);
    }

    async function loadCarrier() {
      const geo = S.data.carrier || await fetchGeo();
      S.data.carrier = geo;
      const flag = countryFlag(geo.countryCode||'UN');
      const c = DC.freq[0];
      spawnNodes([
        {label:geo.query||'?', sublabel: flag + ' ' + (geo.city||'?') + ', ' + (geo.country||'?'), color:c, size:14, speed:0.0015},
        {label:'YOUR NODE', sublabel:'origin', color:'#00FF88', size:10, speed:0, _distance:0},
        {label:geo.isp||'?', sublabel:'ISP', color:c, size:8, speed:0.002},
        {label:(geo.as||'').split(' ')[0]||'ASN', sublabel:'ASN', color:'#CC44FF', size:7, speed:0.003},
        {label:geo.timezone||'', sublabel:'TZ', color:DC.muted, size:5, speed:-0.001},
        {label: (geo.lat!=null ? Number(geo.lat).toFixed(1) : '?') + ',' + (geo.lon!=null ? Number(geo.lon).toFixed(1) : '?'), sublabel:'GEO', color:'#2A3A4A', size:5, speed:0.002},
      ]);
    }

    async function loadTopology() {
      let connections = [];
      try {
        const r = await Promise.race([
          fetch('http://localhost:5001/api/connections'),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'), 800))
        ]);
        if (r.ok) { const d=await r.json(); connections=(d.connections||d||[]).slice(0,12); }
      } catch(e) {}
      if (!connections.length) {
        connections = [
          {dst_ip:'8.8.8.8',    dst_host:'dns.google',     bytes:1240, proto:'UDP'},
          {dst_ip:'1.1.1.1',    dst_host:'cloudflare.com', bytes:3200, proto:'TCP'},
          {dst_ip:'17.57.144.1',dst_host:'apple.com',      bytes:8800, proto:'TCP'},
          {dst_ip:'151.101.1.67',dst_host:'reddit.com',    bytes:4200, proto:'TCP'},
          {dst_ip:'52.20.1.44', dst_host:'aws.com',        bytes:12000,proto:'TCP'},
          {dst_ip:'104.21.14.1',dst_host:'cf-cdn',         bytes:6700, proto:'TCP'},
        ];
      }
      const ips = connections.map(c=>c.dst_ip||c.ip).filter(Boolean).slice(0,10);
      const geos = await fetchBatchGeo(ips);
      const geoMap = {};
      (Array.isArray(geos)?geos:[]).forEach(g => { if (g && g.query) geoMap[g.query]=g; });
      const scores = await Promise.all(ips.map(async ip => {
        try {
          const r = await Promise.race([
            fetch(`${WORKER_URL}/api/abuseipdb?ip=${ip}`),
            new Promise((_,rej)=>setTimeout(()=>rej(), 1200))
          ]);
          if (r.ok) { const d = await r.json(); return d.abuseConfidenceScore || 0; }
        } catch (e) {}
        return 0;
      }));
      const scoreMap = {};
      ips.forEach((ip, i) => { scoreMap[ip] = scores[i] || 0; });
      spawnNodes(connections.map((c,i)=>{
        const ip=c.dst_ip||c.ip||'?';
        const geo=geoMap[ip]||{};
        const label=c.dst_host||ip;
        const threatScore = scoreMap[ip] || 0;
        const blocked = threatScore >= THREAT_BLOCK || S.blocked.has(ip) || S.blocked.has(label);
        return {
          label: label.length>18?label.slice(0,18)+'…':label,
          sublabel: blocked ? ('BLOCKED  ' + threatScore + '%') : (geo.city ? (countryFlag(geo.countryCode) + ' ' + geo.city) : (c.proto||'')),
          color: blocked ? '#FF3366' : DC.freq[1],
          size: 5+Math.min(12, Math.log2((c.bytes||1000)/100)),
          speed: blocked ? -0.006 : 0.002+i*0.0003,
          ip, threatScore, blocked,
        };
      }));
      S.nodes.forEach((n, i) => { if (n.blocked) addLog('AUTO-BLOCK  ' + n.label + '  ' + n.threatScore + '%', '#FF3366'); });
    }

    async function loadStream() {
      if (_dnsTimer) clearInterval(_dnsTimer);
      S.meteors=[]; spawnNodes([]);
      pumpDNS();
      _dnsTimer = setInterval(pumpDNS, 2800);
    }
    async function pumpDNS() {
      if (S.freq!==2) { clearInterval(_dnsTimer); return; }
      const domain = DNS_DOMAINS[_dnsIdx++ % DNS_DOMAINS.length];
      try {
        const d = await fetchDoh(domain);
        const answers = d.Answer||[];
        spawnMeteor(domain, answers.find(a=>a.type===1)?.data||'NXDOMAIN');
      } catch(e) { spawnMeteor(domain,'NXDOMAIN'); }
    }

    async function loadBluetooth() {
      let devices=[];
      try {
        const r=await Promise.race([fetch('http://localhost:5050/api/devices'),new Promise((_,rej)=>setTimeout(()=>rej(),800))]);
        if(r.ok){const d=await r.json();devices=(d.devices||d||[]).slice(0,10);}
      } catch(e) {}
      if (!devices.length) {
        devices=[
          {name:'AirPods Pro',rssi:-42},{name:'Apple Watch',rssi:-48},
          {name:'Mi Band 7',rssi:-61},{name:'Unknown Device',rssi:-74},
          {name:'iPhone 15',rssi:-55},{name:'BLE Beacon',rssi:-82},
        ];
      }
      const nodes = devices.map((d,i)=>{
        const rssi=d.rssi||-70;
        const dist=80+(Math.abs(rssi)-30)*(180/60);
        const str=Math.max(0,Math.min(1,(rssi+30)/-60));
        const unknown = !d.name || d.name === 'Unknown Device' || d.name === 'BLE Beacon';
        const suspicious = unknown && rssi < -78;
        return {label:d.name||'Unknown',sublabel: rssi + ' dBm' + (suspicious ? '  ·  SUSPECT' : ''),color: suspicious ? '#FF3366' : DC.freq[3],size:4+(1-str)*8,speed:0.003+i*0.0002,_distance:dist, threatScore: suspicious ? 40 : 0, blocked: suspicious};
      });
      spawnNodes(nodes);
      nodes.forEach((n,i)=>{if(S.nodes[i])S.nodes[i].distance=n._distance;});
    }

    async function loadThreat() {
      const seedIPs=['185.220.101.50','194.165.16.11','45.142.212.100','91.108.56.196','140.82.112.4','8.8.8.8'];
      const nodes=[];
      for (const ip of seedIPs) {
        let score=0, country='';
        try {
          const r=await Promise.race([fetch(`${WORKER_URL}/api/abuseipdb?ip=${ip}`),new Promise((_,rej)=>setTimeout(()=>rej(),2000))]);
          if(r.ok){const d=await r.json();score=d.abuseConfidenceScore||0;country=d.countryCode||'';}
        } catch(e) {
          score=['185.220','194.165','45.142'].some(p=>ip.startsWith(p))?75:5;
        }
        const bad = score >= THREAT_BLOCK || S.blocked.has(ip);
        nodes.push({
          label:ip,
          sublabel:`${countryFlag(country)} ${bad?'BLOCKED':'clean'} ${score}%`,
          color:bad?DC.freq[4]:'#00D4FF',
          size:bad?9+score/20:6,
          speed:bad?-0.006:0.003,
          ip, threatScore: score, blocked: bad,
        });
      }
      spawnNodes(nodes);
    }

    document.fonts.ready.then(async () => {
      renderDial();
      loop();
      await probeWorker();
      await loadRealm(0);
      setTimeout(() => { S.boot = 0; bootEl.style.opacity = '0'; setTimeout(()=>bootEl.remove(), 800); }, 1500);
    });
  </script>
</body>
